<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minas Navais</title>


    <link rel="stylesheet" href="st.css">


</head>
<body>

    <div id="camp"></div>

    <div id="lives"
        style="display:flex;gap:8px;margin-top:12px;justify-content:center;">
        <img id="life1" src="corac.png" alt="vida" width="40" height="40">
        <img id="life2" src="corac.png" alt="vida" width="40" height="40">
        <img id="life3" src="corac.png" alt="vida" width="40" height="40">
        <img id="life4" src="corac.png" alt="vida" width="40" height="40">
        <img id="life5" src="corac.png" alt="vida" width="40" height="40">
    </div>

    <script>

        const imagens = {
            oculta: 'fire.png',
            agua: 'nada.png',
            barcoVela: 'ship1.png',
            bote: 'ship2.png',
            lancha: 'ship3.png',
            bomba: 'bomba.png',
            coracao: 'corac.png',
            coracaoVazio: 'corvaz.png'
        };

        function embaralhar(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        let elementosTabuleiro = [
            [4, 0, 1, 4, 0, 4, 3, 0, 4, 2],
            [0, 4, 2, 4, 1, 0, 3, 4, 0, 4],
            [3, 4, 4, 0, 0, 1, 4, 2, 0, 4],
            [4, 0, 2, 4, 0, 0, 4, 1, 4, 3],
            [0, 4, 4, 2, 1, 4, 0, 3, 0, 4],
            [4, 0, 3, 4, 0, 2, 0, 4, 0, 1],
            [2, 4, 0, 4, 0, 3, 4, 1, 0, 4],
            [0, 1, 4, 4, 2, 0, 3, 4, 0, 4],
            [4, 0, 3, 0, 4, 2, 0, 1, 4, 0],
            [0, 4, 4, 1, 4, 0, 0, 3, 2, 4]
        ];

        const mapa = elementosTabuleiro.flat();
        embaralhar(mapa);

        const tabuleiro = document.querySelector('#camp');

       const somExplosao = new Audio(
    "ElevenLabs_Explosão_em_cena_de_ação.mp3"
);
const somAgua = new Audio(
    "Som da onda.mp3"
);

const somMadeira = new Audio(
    "AudioMadeira.mp3"
);

somExplosao.volume = 0.2;
somMadeira.volume = 0.3; 
somAgua.volume = 0.3;

        function tocarExplosao() {
            somExplosao.currentTime = 0;
            somExplosao.play();
        }

        function tocarMadeira() {
            somMadeira.currentTime = 0;
            somMadeira.play();
        }
        function tocarAgua(){
            somAgua.currentTime = 0;
            somAgua.playbackRate = 2;
            somAgua.play();
        }

        function revelarCasa(celula, conteudo) {

            if (conteudo == 0)
                celula.style.backgroundImage =
                    "url('" + imagens.agua + "')";

            else if (conteudo == 1)
                celula.style.backgroundImage =
                    "url('" + imagens.barcoVela + "')";

            else if (conteudo == 2)
                celula.style.backgroundImage =
                    "url('" + imagens.bote + "')";

            else if (conteudo == 3)
                celula.style.backgroundImage =
                    "url('" + imagens.lancha + "')";

            else if (conteudo == 4)
                celula.style.backgroundImage =
                    "url('" + imagens.bomba + "')";
        }

        function animarBarco(celula) {
            celula.classList.add("animarBarco");

            celula.addEventListener("animationend", () => {
                celula.classList.remove("animarBarco");
            }, { once: true });
        }

        function animarOnda(celula) {
            celula.classList.add("animarOnda");

            celula.addEventListener("animationend", () => {
                celula.classList.remove("animarOnda");
            }, { once: true });
        }

        function animarBomba(celula) {
            celula.classList.add("animarBomba");

            celula.addEventListener("animationend", () => {
                celula.classList.remove("animarBomba");
            }, { once: true });
        }

        function revelarVizinhos(indice) {

            const direcoes = [-10, 10, -1, 1];

            for (const direcao of direcoes) {

                const posicao = indice + direcao;

                if (posicao < 0 || posicao >= 100) continue;

                if (direcao == -1 && indice % 10 == 0) continue;

                if (direcao == 1 && indice % 10 == 9) continue;

                const celulaVizinha =
                    tabuleiro.children[posicao];

                if (celulaVizinha) {
                    revelarCasa(
                        celulaVizinha,
                        mapa[posicao]
                    );
                }
            }
        }

        function ganharVida() {

            const vidas =
                Array.from(
                    document.querySelectorAll('#lives img')
                );

            for (let i = 0; i < vidas.length; i++) {

                if (
                    vidas[i].getAttribute('src')
                    == imagens.coracaoVazio
                ) {
                    vidas[i].setAttribute(
                        'src',
                        imagens.coracao
                    );
                    break;
                }
            }
        }

        for (let i = 0; i < 100; i++) {

            const celula =
                document.createElement('div');

            celula.classList.add('celCamp');

            celula.style.backgroundImage =
                "url('" + imagens.oculta + "')";

            const conteudo = mapa[i];

            celula.dataset.revelada = 'false';

            celula.addEventListener('click', () => {

                if (
                    celula.dataset.revelada === 'true'
                ) return;

                celula.dataset.revelada = 'true';

                revelarCasa(celula, conteudo);

                if (conteudo == 0) {
                    tocarAgua();
                    animarOnda(celula);
                }

                if (
                    conteudo >= 1 &&
                    conteudo <= 3
                ) {

                    tocarMadeira();

                    animarBarco(celula);

                    ganharVida();

                    revelarVizinhos(i);
                }

                if (conteudo == 4) {

                    animarBomba(celula);

                    tocarExplosao();

                    const vidas =
                        Array.from(
                            document.querySelectorAll(
                                '#lives img'
                            )
                        );

                    for (
                        let j = vidas.length - 1;
                        j >= 0;
                        j--
                    ) {

                        if (
                            vidas[j].getAttribute('src')
                            == imagens.coracao
                        ) {

                            vidas[j].setAttribute(
                                'src',
                                imagens.coracaoVazio
                            );

                            break;
                        }
                    }

                    const semVidas =
                        vidas.every(
                            vida =>
                                vida.getAttribute('src')
                                == imagens.coracaoVazio
                        );

                    if (semVidas) {

                        setTimeout(() => {

                            alert('voce perdeu');

                            location.reload();

                        }, 800);
                    }
                }
            });

            tabuleiro.appendChild(celula);
        }

    </script>

    <input
        type="button"
        value="Reiniciar"
        onclick="location.reload()">

</body>

</html>
